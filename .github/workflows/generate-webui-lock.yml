name: Generate frontend lockfile

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/generate-webui-lock.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.1
      - name: Set up Fedora-aligned npm
        run: npm install --global npm@10.9.8
      - name: Generate complete lockfile
        working-directory: webui
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile directly to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add webui/package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "build(webui): generate npm lockfile"
          git push origin HEAD:main
