name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install system validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck age zstd lz4
      - name: Run project validation
        run: make validate
      - name: Check VM test scripts
        run: bash -n tests/vm/*.sh
      - name: Run ShellCheck
        run: |
          shellcheck build/*.sh
          shellcheck -S error src/feclora/data/feclora-gtk-ready src/feclora/data/feclora-api tests/vm/*.sh
      - name: Check Makefile help
        run: make help
