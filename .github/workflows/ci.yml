name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Textual test dependency
        run: python -m pip install -r requirements-test.txt
      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck age zstd lz4
      - name: Check Bash syntax and project inputs
        run: |
          bash -n build/*.sh
          bash -n src/feclora/data/feclora-api tests/vm/*.sh
          bash build/validate.sh
          bash build/preflight.sh --help
      - name: Run ShellCheck
        run: |
          shellcheck build/*.sh
          shellcheck -S error src/feclora/data/feclora-tui-ready src/feclora/data/feclora-api tests/vm/*.sh
      - name: Validate documentation links and guide assets
        run: python3 build/check_docs.py
      - name: Run Python unit tests
        run: PYTHONPATH=src python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Compile Python modules
        run: python3 -m compileall -q src tests
      - name: Check Makefile help and preflight help
        run: |
          make help
          bash build/preflight.sh --help
