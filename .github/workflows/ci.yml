name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Build Cockpit React frontend
        working-directory: webui
        run: |
          npm install --no-audit --no-fund
          npm audit --audit-level=high
          npm run build
          npm run test:i18n
          test -s dist/index.html
          test -s dist/manifest.json
      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck age
      - name: Check Bash syntax and project inputs
        run: |
          bash -n build/*.sh
          bash build/validate.sh
          bash build/preflight.sh --help
      - name: Run ShellCheck
        run: shellcheck build/*.sh
      - name: Run Python unit tests
        run: PYTHONPATH=src python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Compile Python modules
        run: python3 -m compileall -q src tests
      - name: Check Makefile help and preflight help
        run: |
          make help
          bash build/preflight.sh --help
