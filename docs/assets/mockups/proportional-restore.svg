ed</text><rect x="66" y="466" width="768" height="46" rx="8" fill="#172b3a"/><text x="450" y="495" text-anchor="middle" fill="#fff" font-family="Arial" font-size="14" font-weight="bold">ILLUSTRATIVE MOCKUP — NOT A LIVE SCREEN</text></svg>