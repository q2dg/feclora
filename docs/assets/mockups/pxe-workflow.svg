<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560"><rect width="900" height="560" rx="24" fill="#eef3f7"/><rect x="34" y="30" width="832" height="500" rx="18" fill="#fff" stroke="#cbd5e1"/><rect x="34" y="30" width="832" height="58" rx="18" fill="#172b3a"/><text x="62" y="67" fill="#fff" font-family="Arial" font-size="22" font-weight="bold">FECLORA · NETWORK BOOT</text><text x="65" y="132" fill="#172b3a" font-family="Arial" font-size="26" font-weight="bold">Two distinct PXE paths</text><rect x="65" y="160" width="355" height="210" rx="12" fill="#eff6ff" stroke="#93c5fd"/><text x="90" y="202" fill="#1e3a8a" font-family="Arial" font-size="20" font-weight="bold">INTERACTIVE LIVE</text><text x="90" y="244" fill="#172b3a" font-family="Arial" font-size="16">Boot kernel + initramfs</text><text x="90" y="274" fill="#172b3a" font-family="Arial" font-size="16">Start GTK interface</text><text x="90" y="304" fill="#172b3a" font-family="Arial" font-size="16">Operator selects image/target</text><rect x="480" y="160" width="355" height="210" rx="12" fill="#fff7ed" stroke="#fdba74"/><text x="505" y="202" fill="#9a3412" font-family="Arial" font-size="20" font-weight="bold">UNATTENDED ANSWER</text><text x="505" y="244" fill="#172b3a" font-family="Arial" font-size="16">Validated JSON answer</text><text x="505" y="274" fill="#172b3a" font-family="Arial" font-size="16">Bound image + repository ID</text><text x="505" y="304" fill="#172b3a" font-family="Arial" font-size="16">Explicit whole-disk restore</text><rect x="65" y="395" width="770" height="52" rx="10" fill="#fff1f2" stroke="#fda4af"/><text x="450" y="427" text-anchor="middle" fill="#9f1239" font-family="Arial" font-size="16" font-weight="bold">PXE serves boot assets and answers — not image payloads</text><rect x="65" y="465" width="770" height="40" rx="8" fill="#172b3a"/><text x="450" y="491" text-anchor="middle" fill="#fff" font-family="Arial" font-size="15" font-weight="bold">ILLUSTRATIVE MOCKUP — NOT A LIVE SCREEN</text></svg>