<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Feclora one-way TLS trust workflow mockup</title><desc id="desc">A three-stage diagram showing a Server certificate signed by a certificate authority, a Client trusting the CA certificate, and the Client validating the Server identity over TLS. Private keys remain on the Server.</desc>
<rect width="1200" height="620" rx="28" fill="#f4f7fb"/>
<text x="56" y="66" fill="#15243a" font-family="sans-serif" font-size="28" font-weight="700">SERVER CERTIFICATE &amp; CLIENT TRUST</text>
<text x="56" y="103" fill="#52647a" font-family="sans-serif" font-size="17">Illustrative sequence · one-way TLS authentication</text>
<g font-family="sans-serif">
<rect x="52" y="150" width="330" height="350" rx="20" fill="#fff" stroke="#b8c8dc" stroke-width="2"/>
<circle cx="92" cy="190" r="22" fill="#245b91"/><text x="92" y="198" text-anchor="middle" font-size="20" fill="#fff" font-weight="700">1</text>
<text x="128" y="198" fill="#15243a" font-size="22" font-weight="700">Feclora Server</text>
<rect x="84" y="238" width="266" height="82" rx="12" fill="#e6f0fb" stroke="#8eafd2"/>
<text x="217" y="270" text-anchor="middle" fill="#173c63" font-size="18" font-weight="700">Deployment CA</text><text x="217" y="295" text-anchor="middle" fill="#52647a" font-size="14">Private key stays here</text>
<path d="M217 320 V355" stroke="#245b91" stroke-width="3"/><path d="M207 345 L217 357 L227 345" fill="none" stroke="#245b91" stroke-width="3"/>
<rect x="84" y="365" width="266" height="86" rx="12" fill="#edf7f1" stroke="#9bc9ac"/>
<text x="217" y="399" text-anchor="middle" fill="#245a39" font-size="18" font-weight="700">Server certificate</text><text x="217" y="425" text-anchor="middle" fill="#52647a" font-size="14">SAN: feclora-server</text>
<text x="217" y="478" text-anchor="middle" fill="#52647a" font-size="14">Never copy server/CA private keys</text>
<rect x="435" y="150" width="330" height="350" rx="20" fill="#fff" stroke="#b8c8dc" stroke-width="2"/>
<circle cx="475" cy="190" r="22" fill="#245b91"/><text x="475" y="198" text-anchor="middle" font-size="20" fill="#fff" font-weight="700">2</text>
<text x="511" y="198" fill="#15243a" font-size="22" font-weight="700">Client provisioning</text>
<rect x="467" y="238" width="266" height="82" rx="12" fill="#e6f0fb" stroke="#8eafd2"/>
<text x="600" y="270" text-anchor="middle" fill="#173c63" font-size="18" font-weight="700">CA certificate only</text><text x="600" y="295" text-anchor="middle" fill="#52647a" font-size="14">Trusted root certificate</text>
<path d="M600 320 V355" stroke="#245b91" stroke-width="3"/><path d="M590 345 L600 357 L610 345" fill="none" stroke="#245b91" stroke-width="3"/>
<rect x="467" y="365" width="266" height="86" rx="12" fill="#fff6e6" stroke="#e3c58d"/>
<text x="600" y="399" text-anchor="middle" fill="#76501b" font-size="18" font-weight="700">Expected Server identity</text><text x="600" y="425" text-anchor="middle" fill="#52647a" font-size="14">Address + certificate SAN</text>
<text x="600" y="478" text-anchor="middle" fill="#52647a" font-size="14">MAC is an operational selector</text>
<rect x="818" y="150" width="330" height="350" rx="20" fill="#fff" stroke="#b8c8dc" stroke-width="2"/>
<circle cx="858" cy="190" r="22" fill="#245b91"/><text x="858" y="198" text-anchor="middle" font-size="20" fill="#fff" font-weight="700">3</text>
<text x="894" y="198" fill="#15243a" font-size="22" font-weight="700">TLS connection</text>
<rect x="850" y="238" width="266" height="82" rx="12" fill="#edf7f1" stroke="#9bc9ac"/>
<text x="983" y="270" text-anchor="middle" fill="#245a39" font-size="18" font-weight="700">Validate chain</text><text x="983" y="295" text-anchor="middle" fill="#52647a" font-size="14">Certificate signed by trusted CA</text>
<path d="M983 320 V355" stroke="#245b91" stroke-width="3"/><path d="M973 345 L983 357 L993 345" fill="none" stroke="#245b91" stroke-width="3"/>
<rect x="850" y="365" width="266" height="86" rx="12" fill="#edf7f1" stroke="#9bc9ac"/>
<text x="983" y="399" text-anchor="middle" fill="#245a39" font-size="18" font-weight="700">Verify expected SAN</text><text x="983" y="425" text-anchor="middle" fill="#52647a" font-size="14">Reject mismatch / invalid chain</text>
<text x="983" y="478" text-anchor="middle" fill="#52647a" font-size="14">Client authenticates Server</text>
</g>
<path d="M384 325 H428 M418 315 L428 325 L418 335" fill="none" stroke="#7890aa" stroke-width="3"/>
<path d="M767 325 H811 M801 315 L811 325 L801 335" fill="none" stroke="#7890aa" stroke-width="3"/>
<rect x="52" y="535" width="1096" height="52" rx="12" fill="#fff0ee" stroke="#e4aaa3"/>
<text x="600" y="568" text-anchor="middle" fill="#8d3029" font-family="sans-serif" font-size="17" font-weight="700">No mutual TLS · no Client certificate identity · never distribute private keys</text>
</svg>