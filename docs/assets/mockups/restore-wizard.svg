<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Feclora restore wizard — illustrative mockup</title><desc id="desc">Conceptual Cockpit screen showing image selection, destination validation and destructive confirmation. Not a runtime screenshot.</desc>
<rect width="1200" height="760" rx="18" fill="#edf2f7"/><rect width="1200" height="66" rx="18" fill="#102b4b"/><rect y="48" width="1200" height="18" fill="#102b4b"/><text x="34" y="42" fill="#fff" font-family="Arial" font-size="24" font-weight="700">feclora</text><text x="180" y="42" fill="#c8d8e8" font-family="Arial" font-size="16">Cockpit · Operations</text>
<rect x="28" y="92" width="230" height="636" rx="12" fill="#fff"/><text x="54" y="137" fill="#526276" font-family="Arial" font-size="15">OVERVIEW</text><text x="54" y="190" fill="#526276" font-family="Arial" font-size="19">Storage</text><text x="54" y="238" fill="#526276" font-family="Arial" font-size="17">Repositories</text><rect x="42" y="265" width="202" height="45" rx="7" fill="#e7f2fb"/><text x="58" y="294" fill="#145b91" font-family="Arial" font-size="17" font-weight="700">Operations</text><text x="54" y="353" fill="#526276" font-family="Arial" font-size="17">Deployment</text>
<text x="300" y="128" fill="#102b4b" font-family="Arial" font-size="30" font-weight="700">Restore a disk image</text><text x="300" y="160" fill="#64748b" font-family="Arial" font-size="17">Review the image and destination before any write begins.</text>
<rect x="300" y="188" width="860" height="82" rx="10" fill="#fff" stroke="#d5dee8"/><g font-family="Arial" font-size="15" fill="#64748b"><text x="330" y="220">1  IMAGE</text><text x="515" y="220">2  TARGET</text><text x="730" y="220">3  SAFETY CHECKS</text><text x="970" y="220">4  CONFIRM</text></g><path d="M330 244h770" stroke="#dbe4ed" stroke-width="3"/><path d="M330 244h770" stroke="#1687b8" stroke-width="4"/>
<rect x="300" y="294" width="860" height="360" rx="10" fill="#fff" stroke="#d5dee8"/><text x="332" y="337" fill="#102b4b" font-family="Arial" font-size="22" font-weight="700">Final destination review</text>
<rect x="330" y="365" width="800" height="78" rx="8" fill="#f4f8fc" stroke="#d5dee8"/><text x="355" y="396" fill="#64748b" font-family="Arial" font-size="14">SELECTED IMAGE</text><text x="355" y="424" fill="#173b61" font-family="Arial" font-size="18" font-weight="700">workstation-2026-11-01 · 476 GB</text>
<rect x="330" y="458" width="800" height="78" rx="8" fill="#f4f8fc" stroke="#d5dee8"/><text x="355" y="489" fill="#64748b" font-family="Arial" font-size="14">DESTINATION</text><text x="355" y="517" fill="#173b61" font-family="Arial" font-size="18" font-weight="700">/dev/sdb · 1 TB · verified capacity</text>
<rect x="330" y="551" width="800" height="72" rx="8" fill="#fff5e8" stroke="#e5a23b"/><text x="355" y="579" fill="#8a4c00" font-family="Arial" font-size="16" font-weight="700">Destructive operation</text><text x="355" y="604" fill="#744b00" font-family="Arial" font-size="14">All existing data on /dev/sdb will be overwritten. Re-check device identity.</text>
<rect x="300" y="674" width="860" height="54" rx="10" fill="#fff" stroke="#d5dee8"/><text x="330" y="708" fill="#64748b" font-family="Arial" font-size="14">Illustrative mockup · sample image and target are fictional</text><rect x="980" y="686" width="150" height="34" rx="6" fill="#a33b32"/><text x="1002" y="709" fill="#fff" font-family="Arial" font-size="15" font-weight="700">Confirm restore</text>
<rect x="825" y="20" width="345" height="30" rx="15" fill="#fce9b8"/><text x="997" y="40" text-anchor="middle" fill="#744b00" font-family="Arial" font-size="13" font-weight="700">ILLUSTRATIVE MOCKUP · NOT A SCREENSHOT</text>
