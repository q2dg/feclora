<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" role="img" aria-labelledby="title desc">
<title id="title">Legacy P2V S3 export workflow mockup</title><desc id="desc">A four-stage flow from an S3 object repository and legacy QCOW2 plus JSON sidecar, through bundle verification, to a local or mounted filesystem repository and inventory verification.</desc>
<rect width="1100" height="500" rx="26" fill="#f4f7fb"/><text x="48" y="58" font-family="sans-serif" font-size="27" font-weight="700" fill="#15243a">LEGACY P2V BUNDLE EXPORT</text><text x="48" y="91" font-family="sans-serif" font-size="16" fill="#52647a">Illustrative operator sequence · copy and verify, never delete the source</text>
<g font-family="sans-serif">
<rect x="40" y="135" width="235" height="255" rx="18" fill="#fff" stroke="#b8c8dc" stroke-width="2"/><circle cx="76" cy="173" r="20" fill="#245b91"/><text x="76" y="180" fill="#fff" text-anchor="middle" font-size="18" font-weight="700">1</text><text x="110" y="180" fill="#15243a" font-size="19" font-weight="700">S3 source</text>
<rect x="66" y="214" width="183" height="58" rx="10" fill="#e6f0fb" stroke="#8eafd2"/><text x="157" y="239" fill="#173c63" text-anchor="middle" font-size="16" font-weight="700">image.qcow2</text><text x="157" y="258" fill="#52647a" text-anchor="middle" font-size="12">Legacy disk image</text>
<rect x="66" y="286" width="183" height="58" rx="10" fill="#fff6e6" stroke="#e3c58d"/><text x="157" y="311" fill="#76501b" text-anchor="middle" font-size="16" font-weight="700">image.p2v.json</text><text x="157" y="330" fill="#52647a" text-anchor="middle" font-size="12">Required sidecar</text>
<text x="157" y="370" fill="#52647a" text-anchor="middle" font-size="13">Object repository</text>
<rect x="322" y="135" width="210" height="255" rx="18" fill="#fff" stroke="#b8c8dc" stroke-width="2"/><circle cx="358" cy="173" r="20" fill="#245b91"/><text x="358" y="180" fill="#fff" text-anchor="middle" font-size="18" font-weight="700">2</text><text x="392" y="180" fill="#15243a" font-size="19" font-weight="700">Verify</text>
<rect x="348" y="224" width="158" height="95" rx="12" fill="#edf7f1" stroke="#9bc9ac"/><text x="427" y="256" fill="#245a39" text-anchor="middle" font-size="17" font-weight="700">Bundle checks</text><text x="427" y="281" fill="#52647a" text-anchor="middle" font-size="13">Pair + metadata</text><text x="427" y="300" fill="#52647a" text-anchor="middle" font-size="13">Integrity + size</text><text x="427" y="360" fill="#52647a" text-anchor="middle" font-size="13">Reject invalid input</text>
<rect x="579" y="135" width="230" height="255" rx="18" fill="#fff" stroke="#b8c8dc" stroke-width="2"/><circle cx="615" cy="173" r="20" fill="#245b91"/><text x="615" y="180" fill="#fff" text-anchor="middle" font-size="18" font-weight="700">3</text><text x="649" y="180" fill="#15243a" font-size="19" font-weight="700">Destination</text>
<rect x="605" y="224" width="178" height="58" rx="10" fill="#e6f0fb" stroke="#8eafd2"/><text x="694" y="249" fill="#173c63" text-anchor="middle" font-size="16" font-weight="700">Local repository</text><text x="694" y="268" fill="#52647a" text-anchor="middle" font-size="12">or mounted filesystem</text>
<rect x="605" y="296" width="178" height="50" rx="10" fill="#edf7f1" stroke="#9bc9ac"/><text x="694" y="326" fill="#245a39" text-anchor="middle" font-size="15" font-weight="700">Read/write confirmed</text><text x="694" y="370" fill="#52647a" text-anchor="middle" font-size="13">S3-to-S3 is not supported</text>
<rect x="856" y="135" width="204" height="255" rx="18" fill="#fff" stroke="#b8c8dc" stroke-width="2"/><circle cx="892" cy="173" r="20" fill="#245b91"/><text x="892" y="180" fill="#fff" text-anchor="middle" font-size="18" font-weight="700">4</text><text x="926" y="180" fill="#15243a" font-size="19" font-weight="700">Confirm</text>
<rect x="882" y="224" width="152" height="95" rx="12" fill="#edf7f1" stroke="#9bc9ac"/><text x="958" y="256" fill="#245a39" text-anchor="middle" font-size="17" font-weight="700">Inventory</text><text x="958" y="281" fill="#52647a" text-anchor="middle" font-size="13">Refresh destination</text><text x="958" y="300" fill="#52647a" text-anchor="middle" font-size="13">Check bundle exists</text><text x="958" y="360" fill="#52647a" text-anchor="middle" font-size="13">Import if needed</text>
</g>
<g fill="none" stroke="#7890aa" stroke-width="3"><path d="M278 260 H314 M304 250 L314 260 L304 270"/><path d="M535 260 H571 M561 250 L571 260 L561 270"/><path d="M812 260 H848 M838 250 L848 260 L838 270"/></g>
<rect x="40" y="420" width="1020" height="48" rx="11" fill="#fff0ee" stroke="#e4aaa3"/><text x="550" y="450" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#8d3029">Legacy compatibility path only · new manifest-backed QCOW2 images do not need this export</text>
</svg>