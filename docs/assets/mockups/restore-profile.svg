<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560"><rect width="900" height="560" rx="24" fill="#eef3f7"/><rect x="34" y="28" width="832" height="504" rx="18" fill="#fff" stroke="#cbd5e1"/><rect x="34" y="28" width="832" height="58" rx="18" fill="#172b3a"/><text x="62" y="65" fill="#fff" font-family="Arial" font-size="22" font-weight="bold">FECLORA · RESTORE PROFILES</text><text x="66" y="132" fill="#172b3a" font-family="Arial" font-size="26" font-weight="bold">Single-use restore authorization</text><g font-family="Arial" font-size="17" fill="#172b3a"><rect x="66" y="160" width="768" height="70" rx="10" fill="#eff6ff" stroke="#93c5fd"/><text x="90" y="188" font-weight="bold">1 · Select verified image + persistent repository</text><text x="90" y="212" fill="#64748b" font-size="14">Filesystem-backed repository · manifest checked</text><rect x="66" y="246" width="768" height="70" rx="10" fill="#f8fafc" stroke="#cbd5e1"/><text x="90" y="274" font-weight="bold">2 · Bind stable destination identity</text><text x="90" y="298" fill="#64748b" font-size="14">WWN / serial · expiry · preserve layout</text><rect x="66" y="332" width="768" height="70" rx="10" fill="#f8fafc" stroke="#cbd5e1"/><text x="90" y="360" font-weight="bold">3 · Review target and type exact ERASE confirmation</text><text x="90" y="384" fill="#64748b" font-size="14">Worker revalidates and consumes profile before first write</text></g><rect x="66" y="418" width="768" height="48" rx="9" fill="#fff1f2" stroke="#fda4af"/><text x="450" y="448" text-anchor="middle" fill="#9f1239" font-family="Arial" font-size="16" font-weight="bold">Destructive · single-use · never replay after consumption</text><rect x="66" y="480" width="768" height="32" rx="8" fill="#172b3a"/><text x="450" y="502" text-anchor="middle" fill="#fff" font-family="Arial" font-size="14" font-weight="bold">ILLUSTRATIVE MOCKUP — NOT A LIVE SCREEN</text></svg>